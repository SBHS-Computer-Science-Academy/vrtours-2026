<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Academics Tour — Node Graph</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1117; font-family: system-ui, sans-serif; color: #e0e0e0; }

    h1 {
      text-align: center;
      padding: 18px 0 6px;
      font-size: 1.2rem;
      letter-spacing: .05em;
      color: #a0c4ff;
    }
    p.sub {
      text-align: center;
      font-size: .78rem;
      color: #666;
      margin-bottom: 4px;
    }

    #graph {
      display: block;
      width: 100%;
      height: calc(100vh - 80px);
    }

    .link { stroke: #4a90d9; stroke-opacity: .55; stroke-width: 2; }

    .node circle {
      fill: #1e2a3a;
      stroke: #4a90d9;
      stroke-width: 2.5;
      cursor: grab;
      transition: fill .15s;
    }
    .node circle:hover { fill: #2a3f5a; }
    .node.start circle { fill: #1b3d2a; stroke: #4caf50; stroke-width: 3; }

    .node text {
      font-size: 13px;
      fill: #dce9ff;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .node.start text { fill: #a5d6a7; }

    .arrow {
      fill: none;
      stroke: #4a90d9;
      stroke-opacity: .55;
    }
  </style>
</head>
<body>
  <h1>Academics Tour — Node Graph</h1>
  <p class="sub">Drag nodes to rearrange &nbsp;·&nbsp; <span style="color:#4caf50">Green</span> = start location</p>
  <svg id="graph"></svg>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script>
    const nodes = [
      { id: "main-entrance",  label: "Main Entrance",      r: 42 },
      { id: "senior-lawn",    label: "Senior Lawn",         r: 38 },
      { id: "library",        label: "Library",             r: 38 },
      { id: "translation",    label: "Translation\nCenter", r: 38 },
      { id: "science",        label: "Science\nBuilding",   r: 38 },
      { id: "math",           label: "Math\nBuilding",      r: 36 },
      { id: "english",        label: "English\nBuilding",   r: 36 },
    ];

    const links = [
      { source: "main-entrance", target: "senior-lawn" },
      { source: "senior-lawn",   target: "library" },
      { source: "senior-lawn",   target: "main-entrance" },
      { source: "library",       target: "translation" },
      { source: "library",       target: "senior-lawn" },
      { source: "translation",   target: "science" },
      { source: "translation",   target: "library" },
      { source: "science",       target: "math" },
      { source: "science",       target: "english" },
      { source: "science",       target: "translation" },
      { source: "math",          target: "science" },
      { source: "english",       target: "science" },
    ];

    const START = "main-entrance";

    const svg = d3.select("#graph");
    const W = () => svg.node().clientWidth;
    const H = () => svg.node().clientHeight;

    svg.append("defs").append("marker")
      .attr("id", "arrow")
      .attr("viewBox", "0 -5 10 10")
      .attr("refX", 10)
      .attr("refY", 0)
      .attr("markerWidth", 6)
      .attr("markerHeight", 6)
      .attr("orient", "auto")
      .append("path")
        .attr("d", "M0,-5L10,0L0,5")
        .attr("fill", "#4a90d9")
        .attr("opacity", .6);

    const sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(130))
      .force("charge", d3.forceManyBody().strength(-500))
      .force("center", d3.forceCenter(0, 0))
      .force("collision", d3.forceCollide(d => d.r + 14));

    const g = svg.append("g");

    svg.call(d3.zoom().scaleExtent([.3, 3]).on("zoom", e => g.attr("transform", e.transform)));

    const link = g.append("g")
      .selectAll("line")
      .data(links)
      .join("line")
        .attr("class", "link")
        .attr("marker-end", "url(#arrow)");

    const node = g.append("g")
      .selectAll("g")
      .data(nodes)
      .join("g")
        .attr("class", d => d.id === START ? "node start" : "node")
        .call(d3.drag()
          .on("start", (e, d) => { if (!e.active) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
          .on("end",   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

    node.append("circle").attr("r", d => d.r);

    node.each(function(d) {
      const lines = d.label.split("\n");
      const el = d3.select(this);
      if (lines.length === 1) {
        el.append("text").text(lines[0]);
      } else {
        const offset = lines.length === 2 ? -9 : -18;
        lines.forEach((line, i) => {
          el.append("text")
            .attr("dy", offset + i * 18)
            .text(line);
        });
      }
    });

    sim.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => {
          const dx = d.target.x - d.source.x;
          const dy = d.target.y - d.source.y;
          const dist = Math.sqrt(dx*dx + dy*dy) || 1;
          return d.target.x - (dx / dist) * (d.target.r + 10);
        })
        .attr("y2", d => {
          const dx = d.target.x - d.source.x;
          const dy = d.target.y - d.source.y;
          const dist = Math.sqrt(dx*dx + dy*dy) || 1;
          return d.target.y - (dy / dist) * (d.target.r + 10);
        });

      node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    function center() {
      const w = W(), h = H();
      svg.call(d3.zoom().transform, d3.zoomIdentity.translate(w/2, h/2));
      sim.force("center", d3.forceCenter(0, 0)).alpha(.3).restart();
    }

    window.addEventListener("resize", center);
    requestAnimationFrame(center);
  </script>
</body>
</html>
